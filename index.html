-width:650px}.loginhero h2 span{color:var(--gold)}.loginhero>p{color:#c2cad8;max-width:520px;line-height:1.8}.verse{margin-top:54px;color:#d8c49c;font-size:13px;letter-spacing:.04em}.loginformside{background:var(--bg);display:grid;place-items:center;padding:30px}.loginbox{width:min(430px,100%)}.loginbox h2{font:800 28px Manrope;margin:0 0 8px}.loginbox>p{color:var(--muted);margin:0 0 28px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:12px;font-weight:700;color:#65718a}.field input,.field select{height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:0 13px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d5aa5520}.field .hint{font-size:11px;color:var(--muted)}.wide{width:100%;height:48px}.msg{padding:12px 14px;border-radius:11px;font-size:13px;margin:14px 0}.msg.error{background:#fff0f0;color:#a83e48}.msg.ok{background:#e9f7f2;color:#16745e}.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:8px 0 20px}.sectionhead h2{font:800 25px Manrope;margin:0}.sectionhead p{color:var(--muted);font-size:13px;margin:6px 0 0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat{padding:19px 20px}.stat .label{font-size:12px;color:var(--muted);font-weight:600}.stat .value{font:800 29px Manrope;margin-top:7px}.stat .sub{font-size:11px;color:var(--muted);margin-top:3px}.contentgrid{grid-template-columns:minmax(0,1.5fr) minmax(270px,.7fr)}.progressbar{height:9px;border-radius:20px;background:#edf0f5;overflow:hidden;margin:14px 0 8px}.progressbar span{display:block;height:100%;background:linear-gradient(90deg,#b98a3d,#e6c77f);border-radius:20px}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{padding:11px 14px;color:var(--muted);background:transparent;border-bottom:2px solid transparent;font-weight:700;font-size:13px}.tab.active{color:var(--ink);border-color:var(--gold)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.column{background:#f7f8fb;border:1px solid var(--line);border-radius:15px;padding:13px;min-height:230px}.columnhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;font-size:13px}.count{font-size:11px;background:#e9edf4;border-radius:30px;padding:4px 8px;color:#62708a}.chapter{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;box-shadow:0 4px 12px #17233b08}.chapter strong{font-size:13px;display:block}.chapter small{color:var(--muted);font-size:11px}.chapter .cardactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.chapter .cardactions .btn{padding:7px 9px;font-size:11px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid var(--line)}.pill{display:inline-block;border-radius:30px;padding:5px 9px;background:#eef1f6;color:#5f6c82;font-size:11px;font-weight:700}.pill.active{background:#e6f6ef;color:#16856b}.pill.draft{background:#fff5e4;color:#9b6d22}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.footer{text-align:center;padding:25px;color:var(--muted);font-size:11px}.userchip{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold2);color:#70511f;font-weight:800}.toast{position:fixed;right:22px;bottom:22px;z-index:30;background:var(--navy);color:#fff;border-radius:12px;padding:13px 17px;box-shadow:var(--shadow);font-size:13px;max-width:360px}.toast.error{background:#9f3540}.loading{opacity:.6;pointer-events:none}.note{font-size:12px;color:var(--muted);line-height:1.6}.historyitem{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.dark{--bg:#0b1323;--panel:#131f34;--ink:#eef2f8;--muted:#9ba8bd;--line:#26344b;--navy:#08101e;--navy2:#17243a;--gold2:#4b3a20;--shadow:0 12px 36px #0004}.dark .column{background:#0e192b}.dark .count{background:#26344b;color:#c2cede}.dark .progressbar{background:#28354a}.dark .loginformside{background:var(--bg)}.dark .field label{color:#a8b4c7}.dark .btn.ghost,.dark .iconbtn{background:var(--panel);color:var(--ink)}.dark .chapter{box-shadow:none}
@media(max-width:900px){.loginpage{grid-template-columns:1fr}.loginhero{padding:48px 8vw}.loginhero h2{margin-top:30px}.loginformside{padding:42px 24px}.contentgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
(function(){
"use strict";
const SUPABASE_URL="https://ahepdhqyzyopjiuauyab.supabase.co";
const SUPABASE_KEY="sb_publishable_kbK_waV7Xtm40NRIh7_rDg_AQDpx78J";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById("app");
let user=null,profile=null,activePlan=null,chapterRows=[],bookRows=[],adminProfiles=[],adminPlans=[],activeTab="painel",theme=localStorage.getItem("biblia360-theme")||"light";
document.documentElement.classList.toggle("dark",theme==="dark");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const p=iso.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(message,error){const el=document.getElementById("toast");el.textContent=message;el.className="toast"+(error?" error":"");setTimeout(()=>el.classList.add("hidden"),4200)}
function brand(){return '<div class="brand"><div class="brandmark">✦</div><div><h1>DESAFIO BÍBLIA 360 DIAS</h1><p>Ap. Erica Miranda · Leitura com propósito</p></div></div>'}
function footer(){return '<div class="footer">Desenvolvido por Gilmar Lima - Kingdom Business</div>'}
function showLogin(message){app.innerHTML='<div class="loginpage"><section class="loginhero">'+brand()+'<h2>Uma jornada de <span>fé, constância</span> e transformação.</h2><p>Acompanhe sua leitura bíblica, organize seus capítulos e avance um dia de cada vez. Seu progresso é pessoal e protegido.</p><div class="verse">“Lâmpada para os meus pés é tua palavra.” · Salmos 119:105</div></section><section class="loginformside"><div class="loginbox"><h2>Bem-vindo(a)!</h2><p>Entre com seu acesso fornecido pela administração.</p><form id="loginForm"><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="username" required placeholder="seuemail@exemplo.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></div><button class="btn primary wide" type="submit">Entrar na minha jornada</button></form><div id="loginMsg">'+(message?'<div class="msg error">'+esc(message)+'</div>':'')+'</div><p class="note">O acesso é criado exclusivamente pela administração. Não há cadastro público.</p></div></section></div>';
document.getElementById("loginForm").addEventListener("submit",login);
}
async function login(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent="Verificando acesso…";const email=document.getElementById("email").value.trim().toLowerCase();const password=document.getElementById("password").value;const {data,error}=await sb.functions.invoke("login-gateway",{body:{email,password}});if(error||!data||!data.session){showLogin(data&&data.error?data.error:(error?.message||"Não foi possível entrar."));return}const {error:setError}=await sb.auth.setSession(data.session);if(setError){showLogin(setError.message);return}await afterLogin()}
async function afterLogin(){const {data:{user:u}}=await sb.auth.getUser();if(!u){showLogin();return}user=u;const {data:p,error}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();if(error||!p||!p.is_active){await sb.auth.signOut();user=null;showLogin("Acesso não habilitado. Procure a administração.");return}profile=p;if(p.must_change_password){renderPasswordChange();return}await renderApp()}
function renderPasswordChange(){app.innerHTML='<div class="loginpage"><section class="loginhero">'+brand()+'<h2>Proteja seu acesso.</h2><p>Por segurança, defina uma nova senha pessoal antes de continuar para sua jornada.</p></section><section class="loginformside"><div class="loginbox"><h2>Primeiro acesso</h2><p>Crie uma senha que somente você conheça.</p><form id="passForm"><div class="field"><label>NOVA SENHA</label><input id="newPass" type="password" minlength="12" required placeholder="Mínimo 12 caracteres"></div><div class="field"><label>CONFIRMAR SENHA</label><input id="confirmPass" type="password" minlength="12" required placeholder="Repita a nova senha"></div><p class="note">Use no mínimo 12 caracteres, incluindo letras maiúsculas, minúsculas e números.</p><button class="btn primary wide" type="submit">Salvar nova senha</button></form><div id="passMsg"></div></div></section></div>';document.getElementById("passForm").addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("newPass").value,c=document.getElementById("confirmPass").value;if(p!==c){document.getElementById("passMsg").innerHTML='<div class="msg error">As senhas não coincidem.</div>';return}const {data,error}=await sb.functions.invoke("change-password",{body:{password:p}});if(error||!data?.success){document.getElementById("passMsg").innerHTML='<div class="msg error">'+esc(data?.error||error?.message||"Falha ao alterar senha.")+'</div>';return}profile.must_change_password=false;toast("Senha alterada com sucesso.");await renderApp()})}
async function renderApp(){document.documentElement.classList.toggle("dark",theme==="dark");if(profile.role==="admin"){await loadAdmin();renderAdmin()}else{await loadParticipant();renderParticipant()}}
async function fetchAll(makeQuery){let all=[];for(let start=0;start<50000;start+=1000){const {data,error}=await makeQuery().range(start,start+999);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break}return all}
async function loadParticipant(){const {data,error}=await sb.from("reading_plans").select("*").eq("user_id",user.id).eq("status","active").maybeSingle();if(error)throw error;activePlan=data;if(!activePlan){chapterRows=[];bookRows=[];return}chapterRows=await fetchAll(()=>sb.from("plan_chapters").select("id,chapter_number,scheduled_date,status,board_status,book_id,bible_books(name,abbreviation)").eq("plan_id",activePlan.id).order("scheduled_date").order("book_id").order("chapter_number"));const overdue=chapterRows.some(c=>c.status!=="completed"&&c.scheduled_date<today());if(overdue&&today()<=activePlan.end_date){const {error:replanError}=await sb.rpc("redistribute_my_plan",{p_plan_id:activePlan.id});if(!replanError){chapterRows=await fetchAll(()=>sb.from("plan_chapters").select("id,chapter_number,scheduled_date,status,board_status,book_id,bible_books(name,abbreviation)").eq("plan_id",activePlan.id).order("scheduled_date").order("book_id").order("chapter_number"));sessionStorage.setItem("biblia360-auto-replanned","1")}}const {data:books}=await sb.from("bible_books").select("*").eq("composition_id",activePlan.composition_id).order("book_order");bookRows=books||[]}
async function loadAdmin(){const {data:p,error}=await sb.from("profiles").select("id,full_name,username,email,role,is_active,created_at").order("full_name");if(error)throw error;adminProfiles=p||[];const {data:plans, error:pe}=await sb.from("reading_plans").select("id,user_id,status,start_date,end_date,composition_id,created_at").order("created_at",{ascending:false});if(pe)throw pe;adminPlans=plans||[]}
function shell(content,tab){return '<div class="wrap"><header class="topbar">'+brand()+'<div class="actions"><div class="userchip"><div class="avatar">'+esc((profile.full_name||"U").charAt(0).toUpperCase())+'</div><span class="userlabel">'+esc(profile.full_name)+'</span></div><button class="iconbtn" id="themeBtn" title="Alternar tema">◐</button><button class="btn ghost" id="logoutBtn">Sair</button></div></header>'+content+footer()+'</div>'}
function bindShell(){document.getElementById("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("biblia360-theme",theme);document.documentElement.classList.toggle("dark",theme==="dark")};document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();user=null;profile=null;showLogin()}}
function renderParticipant(){let done=chapterRows.filter(c=>c.status==="completed").length,total=chapterRows.length,pct=total?Math.round(done/total*100):0;let pending=chapterRows.filter(c=>c.status!=="completed");let overdue=pending.filter(c=>c.scheduled_date<today()).length;let todayCount=pending.filter(c=>c.scheduled_date===today()).length;
let body='<div class="sectionhead"><div><h2>Minha jornada</h2><p>Olá, '+esc(profile.full_name.split(" ")[0])+'. Continue avançando no seu ritmo.</p></div><div class="actions">'+(activePlan?'<button class="btn ghost" id="exportBtn">Exportar progresso</button><button class="btn gold" id="redistributeBtn">Reorganizar pendências</button>':'')+'</div></div>';
if(!activePlan){body+='<div class="panel empty"><h3>Nenhum plano ativo</h3><p>A administração ainda não vinculou um plano de leitura ao seu usuário.</p></div>';app.innerHTML=shell(body);bindShell();return}
body+='<div class="grid stats"><div class="panel stat"><div class="label">PROGRESSO GERAL</div><div class="value">'+pct+'%</div><div class="sub">'+done+' de '+total+' capítulos concluídos</div></div><div class="panel stat"><div class="label">CAPÍTULOS PENDENTES</div><div class="value">'+(total-done)+'</div><div class="sub">Capítulos que faltam concluir</div></div><div class="panel stat"><div class="label">ATRASADOS</div><div class="value">'+overdue+'</div><div class="sub">Pendências anteriores a hoje</div></div><div class="panel stat"><div class="label">PLANO DE LEITURA</div><div class="value">360 <span style="font-size:14px">dias</span></div><div class="sub">'+dateFmt(activePlan.start_date)+' até '+dateFmt(activePlan.end_date)+'</div></div></div>';
body+='<div class="grid contentgrid"><section class="panel"><div class="sectionhead"><div><h2>Meu progresso</h2><p>'+esc(activePlan.composition_id===73?"Bíblia católica · 73 livros":"Bíblia protestante · 66 livros")+'</p></div><strong>'+done+'/'+total+'</strong></div><div class="progressbar"><span style="width:'+pct+'%"></span></div><div class="note">'+pct+'% da leitura concluída. '+todayCount+' capítulo(s) programado(s) para hoje.</div></section><section class="panel"><h3 style="font:800 16px Manrope;margin:0 0 12px">Resumo da leitura</h3><div class="historyitem"><span>Início do plano</span><strong>'+dateFmt(activePlan.start_date)+'</strong></div><div class="historyitem"><span>Encerramento previsto</span><strong>'+dateFmt(activePlan.end_date)+'</strong></div><div class="historyitem"><span>Ritmo médio</span><strong>'+ (done? (done/Math.max(1,Math.ceil((new Date().getTime()-new Date(activePlan.start_date+"T12:00:00").getTime())/86400000))).toFixed(1):"0")+' cap./dia</strong></div><div class="historyitem"><span>Capítulos hoje</span><strong>'+todayCount+'</strong></div></section></div>';
body+='<div class="sectionhead" style="margin-top:28px"><div><h2>Meu Kanban de leitura</h2><p>Organize sua leitura em três etapas. Marque cada capítulo como lido ao concluir.</p></div></div><div class="board" id="board"></div><div class="panel" style="margin-top:18px"><div class="sectionhead"><div><h2>Histórico recente</h2><p>Registro das alterações e capítulos concluídos.</p></div><button class="btn ghost" id="printBtn">Imprimir / PDF</button></div><div id="history"></div></div>';
app.innerHTML=shell(body);bindShell();renderBoard();loadHistory();
document.getElementById("redistributeBtn").onclick=async()=>{if(!confirm("Reorganizar todos os capítulos pendentes a partir de hoje? Os capítulos concluídos serão preservados."))return;const {data,error}=await sb.rpc("redistribute_my_plan",{p_plan_id:activePlan.id});if(error){toast(error.message,true);return}toast((data||0)+" capítulo(s) reorganizado(s).");await loadParticipant();renderParticipant()};
document.getElementById("exportBtn").onclick=exportProgress;document.getElementById("printBtn").onclick=()=>window.print()}
function renderBoard(){const groups=[["programado","Programado"],["planejado_do_dia","Planejado do dia"],["lido","Lido"]];const board=document.getElementById("board");if(!board)return;board.innerHTML=groups.map(g=>{const items=chapterRows.filter(c=>g[0]==="lido"?c.status==="completed":c.status!=="completed"&&c.board_status===g[0]);return '<section class="column"><div class="columnhead"><span>'+g[1]+'</span><span class="count">'+items.length+'</span></div>'+ (items.length?items.slice(0,120).map(c=>chapterCard(c,g[0])).join(""):'<div class="empty">Nenhum capítulo nesta etapa.</div>')+'</section>'}).join("");board.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>updateChapter(b.dataset.id,b.dataset.action))}
function chapterCard(c,group){const book=c.bible_books||{};const label=(book.name||"Livro")+" · Capítulo "+c.chapter_number;let buttons="";if(group==="programado")buttons='<button class="btn ghost" data-action="today" data-id="'+c.id+'">Planejar hoje</button>';if(group==="planejado_do_dia")buttons='<button class="btn gold" data-action="done" data-id="'+c.id+'">Marcar lido</button><button class="btn ghost" data-action="later" data-id="'+c.id+'">Voltar</button>';if(group==="lido")buttons='<button class="btn ghost" data-action="undo" data-id="'+c.id+'">Desfazer</button>';return '<article class="chapter"><strong>'+esc(label)+'</strong><small>Programado para '+dateFmt(c.scheduled_date)+'</small><div class="cardactions">'+buttons+'</div></article>'}
async function updateChapter(id,action){const c=chapterRows.find(x=>x.id===id);if(!c)return;let patch={};if(action==="today")patch={board_status:"planejado_do_dia"};if(action==="later")patch={board_status:"programado"};if(action==="done")patch={status:"completed",completed_by:user.id,completed_at:new Date().toISOString(),board_status:"lido"};if(action==="undo")patch={status:"pending",completed_by:null,completed_at:null,board_status:"programado"};const {error}=await sb.from("plan_chapters").update(patch).eq("id",id);if(error){toast(error.message,true);return}await loadParticipant();renderParticipant();toast(action==="done"?"Capítulo concluído. Parabéns!":"Etapa atualizada.")}
async function loadHistory(){const box=document.getElementById("history");if(!box||!activePlan)return;const {data,error}=await sb.from("chapter_events").select("event_type,occurred_at,previous_date,new_date,plan_chapters(chapter_number,bible_books(name))").eq("plan_id",activePlan.id).order("occurred_at",{ascending:false}).limit(12);if(error){box.innerHTML='<div class="empty">Histórico indisponível.</div>';return}if(!data?.length){box.innerHTML='<div class="empty">Seu histórico aparecerá aqui conforme você avançar.</div>';return}box.innerHTML=data.map(e=>'<div class="historyitem"><span><strong>'+esc(e.plan_chapters?.bible_books?.name||"Capítulo")+' '+esc(e.plan_chapters?.chapter_number||"")+'</strong> · '+({completed:"concluído",uncompleted:"reaberto",rescheduled:"reprogramado"}[e.event_type]||e.event_type)+'</span><span>'+new Date(e.occurred_at).toLocaleString("pt-BR")+'</span></div>').join("")}
function exportProgress(){const rows=[["Livro","Capítulo","Data programada","Status"],...chapterRows.map(c=>[(c.bible_books?.name||""),c.chapter_number,c.scheduled_date,c.status==="completed"?"Lido":c.board_status==="planejado_do_dia"?"Planejado do dia":"Programado"])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="meu-progresso-biblia-360.csv";a.click();URL.revokeObjectURL(a.href)}
function renderAdmin(){const totalUsers=adminProfiles.filter(p=>p.role==="participant").length,activeUsers=adminProfiles.filter(p=>p.role==="participant"&&p.is_active).length;let body='<div class="sectionhead"><div><h2>Painel administrativo</h2><p>Gestão de participantes, planos e acompanhamento do desafio.</p></div></div><div class="grid stats"><div class="panel stat"><div class="label">PARTICIPANTES</div><div class="value">'+totalUsers+'</div><div class="sub">Usuários cadastrados</div></div><div class="panel stat"><div class="label">ACESSOS ATIVOS</div><div class="value">'+activeUsers+'</div><div class="sub">Participantes habilitados</div></div><div class="panel stat"><div class="label">PLANOS CRIADOS</div><div class="value">'+adminPlans.length+'</div><div class="sub">Planos individuais</div></div><div class="panel stat"><div class="label">PLANOS ATIVOS</div><div class="value">'+adminPlans.filter(p=>p.status==="active").length+'</div><div class="sub">Em andamento</div></div></div><div class="tabs"><button class="tab '+(activeTab==="painel"?"active":"")+'" data-tab="painel">Visão geral</button><button class="tab '+(activeTab==="usuarios"?"active":"")+'" data-tab="usuarios">Participantes</button><button class="tab '+(activeTab==="planos"?"active":"")+'" data-tab="planos">Planos de leitura</button></div><div id="adminContent"></div>';
app.innerHTML=shell(body);bindShell();document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderAdmin()});renderAdminTab()}
function renderAdminTab(){const box=document.getElementById("adminContent");if(!box)return;if(activeTab==="usuarios"){box.innerHTML='<div class="grid contentgrid"><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 16px">Cadastrar participante</h3><form id="newUserForm" class="formgrid"><div class="field full"><label>NOME COMPLETO</label><input id="newName" required minlength="3" placeholder="Nome do participante"></div><div class="field"><label>USUÁRIO</label><input id="newUsername" required minlength="3" placeholder="ex.: maria.silva"></div><div class="field"><label>E-MAIL</label><input id="newEmail" type="email" required placeholder="email@exemplo.com"></div><div class="field full"><label>SENHA TEMPORÁRIA</label><input id="newPassword" type="text" required minlength="12" placeholder="Mínimo 12 caracteres"><span class="hint">Entregue ao participante por canal seguro. Ele deverá trocá-la no primeiro acesso.</span></div><div class="full"><button class="btn primary" type="submit">Criar acesso</button></div></form><div id="newUserMsg"></div></section><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 12px">Orientação de acesso</h3><p class="note">Não existe cadastro público. Crie o acesso individualmente, informe as credenciais por canal privado e oriente o participante a trocar a senha no primeiro login. Nunca compartilhe senhas em grupos.</p><div class="msg ok">O participante só poderá visualizar seus próprios planos, capítulos e histórico.</div></section></div><div class="panel" style="margin-top:18px"><div class="sectionhead"><div><h2>Participantes cadastrados</h2><p>Lista administrativa de acessos.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+adminProfiles.filter(p=>p.role==="participant").map(p=>'<tr><td><strong>'+esc(p.full_name)+'</strong></td><td>'+esc(p.username)+'</td><td>'+esc(p.email)+'</td><td>Participante</td><td><span class="pill '+(p.is_active?"active":"")+'">'+(p.is_active?"Ativo":"Inativo")+'</span></td><td><button class="btn '+(p.is_active?"danger":"ghost")+'" data-user-action="'+(p.is_active?"deactivate":"reactivate")+'" data-user-id="'+p.id+'">'+(p.is_active?"Desativar":"Reativar")+'</button></td></tr>').join("")+'</tbody></table></div></div>';
document.getElementById("newUserForm").onsubmit=createParticipant;box.querySelectorAll("[data-user-action]").forEach(b=>b.onclick=async()=>{const action=b.dataset.userAction;const label=action==="deactivate"?"desativar":"reativar";if(!confirm("Confirma "+label+" este participante?"))return;b.disabled=true;const {data,error}=await sb.functions.invoke("admin-manage-user",{body:{user_id:b.dataset.userId,action}});if(error||!data?.success){toast(data?.error||error?.message||"Não foi possível alterar o acesso.",true);b.disabled=false;return}toast(action==="deactivate"?"Acesso desativado.":"Acesso reativado.");await loadAdmin();renderAdminTab()});return}
if(activeTab==="planos"){box.innerHTML='<div class="grid contentgrid"><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 16px">Criar plano individual</h3><form id="planForm" class="formgrid"><div class="field full"><label>PARTICIPANTE</label><select id="planUser" required><option value="">Selecione</option>'+adminProfiles.filter(p=>p.role==="participant"&&p.is_active).map(p=>'<option value="'+p.id+'">'+esc(p.full_name)+' · '+esc(p.email)+'</option>').join("")+'</select></div><div class="field"><label>COMPOSIÇÃO BÍBLICA</label><select id="composition"><option value="66">Protestante · 66 livros</option><option value="73">Católica · 73 livros</option></select></div><div class="field"><label>DATA DE INÍCIO</label><input id="startDate" type="date" value="'+today()+'" required></div><div class="field"><label>DURAÇÃO</label><input value="360 dias" disabled></div><div class="field"><label>DATA FINAL PREVISTA</label><input id="endDatePreview" disabled value="'+dateFmt(addDays(today(),359))+'"></div><div class="full"><button class="btn primary" type="submit">Gerar plano de 360 dias</button></div></form><div id="planMsg"></div><p class="note">O sistema distribui todos os capítulos ao longo dos 360 dias, preservando a sequência dos livros. O plano só será ativado após a gravação dos capítulos e calendário.</p></section><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 12px">Como funciona</h3><p class="note">Cada participante recebe um plano independente. A leitura é distribuída de forma equilibrada por dia. Capítulos concluídos ficam preservados; as pendências podem ser reorganizadas sem apagar o histórico.</p><div class="msg ok">A composição bíblica pode ser de 66 ou 73 livros.</div></section></div>';
document.getElementById("startDate").onchange=e=>document.getElementById("endDatePreview").value=dateFmt(addDays(e.target.value,359));document.getElementById("planForm").onsubmit=createPlan;return}
box.innerHTML='<div class="grid contentgrid"><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 12px">Planos recentes</h3><div class="tablewrap"><table class="table"><thead><tr><th>Participante</th><th>Composição</th><th>Período</th><th>Status</th></tr></thead><tbody>'+adminPlans.slice(0,12).map(p=>{const who=adminProfiles.find(u=>u.id===p.user_id);return '<tr><td>'+esc(who?.full_name||"Participante")+'</td><td>'+ (p.composition_id===73?"73 livros":"66 livros")+'</td><td>'+dateFmt(p.start_date)+' – '+dateFmt(p.end_date)+'</td><td><span class="pill '+(p.status==="active"?"active":"draft")+'">'+esc(p.status)+'</span></td></tr>'}).join("")+'</tbody></table></div></section><section class="panel"><h3 style="font:800 17px Manrope;margin:0 0 12px">Acesso e segurança</h3><p class="note">O cadastro de usuários é restrito ao administrador. As políticas de banco isolam os dados por participante. O histórico de alterações e tentativas de autenticação fica registrado.</p><button class="btn gold" id="goPlans">Criar plano de leitura</button></section></div>';document.getElementById("goPlans").onclick=()=>{activeTab="planos";renderAdmin()}}
async function createParticipant(e){e.preventDefault();const msg=document.getElementById("newUserMsg"),btn=e.submitter;btn.disabled=true;btn.textContent="Criando…";const payload={full_name:document.getElementById("newName").value.trim(),username:document.getElementById("newUsername").value.trim(),email:document.getElementById("newEmail").value.trim(),password:document.getElementById("newPassword").value};const {data,error}=await sb.functions.invoke("admin-create-user",{body:payload});btn.disabled=false;btn.textContent="Criar acesso";if(error||!data?.success){msg.innerHTML='<div class="msg error">'+esc(data?.error||error?.message||"Não foi possível criar usuário.")+'</div>';return}msg.innerHTML='<div class="msg ok">Acesso criado para '+esc(data.user.full_name)+'. Entregue a senha temporária por canal privado.</div>';document.getElementById("newUserForm").reset();await loadAdmin();renderAdminTab()}
async function createPlan(e){e.preventDefault();const msg=document.getElementById("planMsg"),btn=e.submitter;const userId=document.getElementById("planUser").value,comp=Number(document.getElementById("composition").value),start=document.getElementById("startDate").value;if(!userId||!start){msg.innerHTML='<div class="msg error">Preencha os campos obrigatórios.</div>';return}if(adminPlans.some(p=>p.user_id===userId&&p.status==="active")){msg.innerHTML='<div class="msg error">Este participante já possui um plano ativo. Finalize ou pause o plano atual antes de criar outro.</div>';return}btn.disabled=true;btn.textContent="Gerando capítulos…";try{const end=addDays(start,359);const {data:plan,error:pe}=await sb.from("reading_plans").insert({user_id:userId,composition_id:comp,start_date:start,end_date:end,status:"draft",created_by:user.id}).select().single();if(pe)throw pe;const books=await fetchAll(()=>sb.from("bible_books").select("id,book_order,name,chapter_count").eq("composition_id",comp).order("book_order"));const chapters=[];books.forEach(b=>{for(let n=1;n<=b.chapter_count;n++)chapters.push({book_id:b.id,chapter_number:n})});const total=chapters.length,days=[];for(let d=0;d<360;d++)days.push({plan_id:plan.id,plan_date:addDays(start,d),schedule_kind:"reading",source:"original"});for(let i=0;i<chapters.length;i++){chapters[i]={plan_id:plan.id,book_id:chapters[i].book_id,chapter_number:chapters[i].chapter_number,scheduled_date:addDays(start,Math.floor(i*360/total)),status:"pending",board_status:"programado",schedule_source:"original"}}for(let i=0;i<days.length;i+=500){const {error}=await sb.from("daily_schedule").insert(days.slice(i,i+500));if(error)throw error}for(let i=0;i<chapters.length;i+=500){const {error}=await sb.from("plan_chapters").insert(chapters.slice(i,i+500));if(error)throw error}const {error:ae}=await sb.from("reading_plans").update({status:"active",activated_at:new Date().toISOString()}).eq("id",plan.id);if(ae)throw ae;await loadAdmin();msg.innerHTML='<div class="msg ok">Plano ativado! '+total+' capítulos distribuídos em 360 dias.</div>';toast("Plano individual criado com sucesso.");document.getElementById("planForm").reset();document.getElementById("startDate").value=today();document.getElementById("endDatePreview").value=dateFmt(addDays(today(),359));}catch(err){msg.innerHTML='<div class="msg error">Não foi possível concluir o plano: '+esc(err.message||String(err))+'. O rascunho pode ter sido criado; verifique a lista antes de tentar novamente.</div>'}finally{btn.disabled=false;btn.textContent="Gerar plano de 360 dias"}}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)await afterLogin();else showLogin()}
boot().catch(e=>{app.innerHTML='<div class="wrap"><div class="panel"><h2>Não foi possível carregar</h2><p>'+esc(e.message||String(e))+'</p><button class="btn primary" onclick="location.reload()">Tentar novamente</button></div></div>'});
})();
</script>
